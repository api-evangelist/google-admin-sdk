aid: google-admin-sdk
name: Google Admin SDK
description: >-
  The Google Admin SDK provides a collection of RESTful APIs for managing Google Workspace organizations at scale. It
  includes the Directory API for managing users, groups, devices, and organizational units; the Reports API for auditing
  activity and usage; and the Data Transfer API for migrating data between users. These APIs enable programmatic
  integration with enterprise IT infrastructure.
